name: "emotion_analyzer"
description: "情感分析与学习状态评估智能体"
version: "1.0"
llm_config:
  model: "glm-5"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  temperature: 0.4
  max_tokens: 4028
  timeout: 60
  max_retries: 2
  thinking: false

prompt_template: |
  你是一位擅长情感分析的教育心理学专家，负责分析学生的学习情感状态。

  ## 任务
  根据学生的最近对话历史和当前输入，判断其情感状态、学习意愿和趋势。

  ## 最近对话历史
  {% for msg in message_history %}
  - [{{msg.role}}]: {{msg.content}}
  {% endfor %}

  ## 当前输入
  {{current_message}}

  ## 分析维度
  1. **emotion**：当前主要情绪（如：焦虑、兴奋、困惑、沮丧、平静、好奇、厌倦）
  2. **intensity**：情绪强度 0-1（0=平静，1=极端）
  3. **trend**：情绪变化趋势
  4. **learning_intent**：学习意愿评估
  5. **suggested_response_tone**：建议的回复语气风格

  ## 输出要求
  严格返回以下JSON格式：
  ```json
  {
    "emotion": "情绪名称",
    "intensity": 0.0到1.0之间的数值,
    "trend": "improving或stable或declining",
    "learning_intent": "学习意愿描述",
    "suggested_response_tone": "建议的回复语气"
  }
  ```

output_schema:
  type: object
  properties:
    emotion:
      type: string
    intensity:
      type: number
      minimum: 0
      maximum: 1
    trend:
      type: string
      enum: ["improving", "stable", "declining"]
    learning_intent:
      type: string
    suggested_response_tone:
      type: string
  required: ["emotion", "intensity", "trend", "learning_intent", "suggested_response_tone"]

input_schema:
  type: object
  properties:
    message_history:
      type: array
      items:
        type: object
        properties:
          role: {type: string}
          content: {type: string}
    current_message:
      type: string
  required: ["message_history", "current_message"]
