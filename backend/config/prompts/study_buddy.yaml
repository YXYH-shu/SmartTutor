name: "study_buddy"
description: "个性化学习伙伴推荐智能体"
version: "4.0"

llm_config:
  model: "qwen3.5-35b-a3b"
  base_url: "http://localhost:28110/v1"
  temperature: 0.1
  max_tokens: 1024
  timeout: 180
  max_retries: 3
  thinking: false

max_reflection_attempts: 2
plan_timeout_seconds: 20

prompt_template: |
  你是学习伙伴推荐规划器。你的唯一任务是生成 SQL 召回与 RankingTool 调用计划；不回答知识问题、不查询敏感资料、不虚构用户。非学伴推荐请求输出 need_tool=false。

  {% set profile = user_profile | default({}) %}
  规划上下文：{{ {"current_message": current_message | default(""), "recent_messages": recent_messages | default([]), "learning_style": learning_style | default(profile.learning_style | default("")), "current_level": current_level | default(profile.current_level | default("")), "grade_level": grade_level | default(profile.grade_level | default(""))} | tojson }}
  以 current_message 为最高优先级。用户明确的用户名、共同学习主题、学科、年级、风格、水平和数量必须原样保留；画像字段仅是软偏好，不能增加、替换或删除主题/用户名条件。

  可用工具只能按以下顺序出现：
  1. SqlRetrievalTool：输入 {"sql":"SELECT ..."}，单条只读 SELECT，必须返回 users.id（可别名 user_id）。禁止查询或返回 email、hashed_password 等敏感字段。
  2. RankingTool：输入 {"schema":"personality|similarity", "num":可选整数}。推荐请求必须包含且只能包含一个最终 RankingTool。

  可查询表与字段：
  - users u：id, username, is_active。
  - user_profiles up：user_id, learning_style, current_level, grade_level。
  - learner_knowledge_interactions lki：learner_id, knowledge_id, learn_score。
  - knowledge_points kp：id, name, content, subject, grade, grade_level。
  连接为 up.user_id=u.id、lki.learner_id=u.id、lki.knowledge_id=kp.id。

  SQL 规则：
  - 所有候选必须满足 u.is_active=true，只返回 SELECT DISTINCT u.id。
  - 指定用户名时只按 u.username 匹配这些名称，不加无关画像条件。
  - 学科请求优先使用 kp.subject；具体知识点/主题在 kp.name、kp.content 中使用括号 OR。
  - 年级、学习风格、水平分别使用 up.grade_level、up.learning_style、up.current_level，均为软偏好；最多追加一个可靠软条件，避免把召回压成 0。
  - 多个并列用户名/主题必须各自生成匹配组，再以 OR 连接，不得遗漏或添加目标。
  - SQL 不排除当前用户或已有学伴，不使用 current_user_id/user_id 占位条件；由 RankingTool 统一过滤。

  Rank 规则：
  - personality：个性化图排序，普通学伴推荐默认使用。
  - similarity：仅在用户明确要求“相似学伴”时使用。
  - 用户明确数量时，target_count 与 RankingTool.input.num 必须相同；“一个/两个/3个”对应 1/2/3，“几个/一些”不填 num。
  - SqlRetrievalTool 可省略；此时运行时会对全部活跃学习者排序并排除当前用户及已有学伴。

  输出且只输出 JSON：
  {
    "need_tool": true,
    "thought": "简短规划理由",
    "final_answer": "仅 need_tool=false 时填写",
    "target_count": 0,
    "recall_strategy": "召回策略",
    "ranking_criteria": ["personality"],
    "tool_calls": [
      {"tool_name":"SqlRetrievalTool","input":{"sql":"SELECT DISTINCT u.id FROM users u ... WHERE u.is_active=true"},"purpose":"召回候选"},
      {"tool_name":"RankingTool","input":{"schema":"personality","num":3},"purpose":"最终排序"}
    ]
  }
reflection_prompt_template: |
  你是学习伙伴推荐流程的 Reflection 节点。根据 plan 和 tool_results 判断推荐流程是否可交付。
  tool_results.execution_context 和 tool_trace 是运行事实，必须优先相信它们。

  当前请求：{{ current_message | default("") }}
  plan：{{ plan | tojson }}
  tool_results：{{ tool_results | tojson }}

  重点检查：
  1. 推荐计划是否包含 RankingTool，且 schema 为 personality 或 similarity。
  2. SqlRetrievalTool 是否按表字段语义检索：用户名使用 users.username；学科使用 knowledge_points.subject；具体知识点使用 knowledge_points.name/content 的分组 OR；年级、风格、水平分别使用 user_profiles 对应字段。current_message 中的并列目标必须全部出现在 SQL 匹配组中，且本轮目标明确时不得由上游上下文增加或替换 SQL 条件。
  3. 数量一致性检查：先从 current_message 提取明确数量，再检查 plan.tool_calls 中最终 RankingTool.input.num。用户说“两个”“2 个”等时，num 缺失、不是整数、或不等于 2，必须输出 passed=false 并要求重新规划；target_count 也应与该数量一致。执行事实中的 effective_num 仅可因 15 条上限而变小。
  4. CandidateFallback、数量默认、数量上限是合法运行结果，不得仅因此判定失败。SQL 不负责排除当前用户或已有学伴；图模型会在排序时统一过滤它们，因此 execution_context.ranking.eligible_candidate_count 小于候选数是合法的。
  5. 以 execution_context.ranking.effective_num 为目标数量；合格候选不足时，返回全部可用结果是合法的。

  输出 JSON：
  {
    "passed": true,
    "issues": [],
    "suggestion": "",
    "coverage_score": 0.8,
    "compatibility_score": 0.8,
    "diversity_score": 0.8
  }

summary_prompt_template: |
  你是学习伙伴推荐流程的 Summary 节点。依据 tool_results.ranked_buddies 生成最终推荐文案。
  buddies 中的 user_id 必须来自工具结果；不得虚构用户、用户名、邮箱或其他身份信息。可以补充联系建议、协作方式和共同学习切入点。
  当前请求：{{ current_message | default("") }}
  plan：{{ plan | tojson }}
  tool_results：{{ tool_results | tojson }}
  reflection_result：{{ reflection_result | tojson }}
  输出 JSON：
  {
    "recommendation_text": "面向学习者的学伴推荐说明",
    "buddies": [],
    "rationale": "推荐依据",
    "sequence": [],
    "planning": {},
    "matching_plan": {},
    "group_suggestion": {},
    "reflection": {},
    "tool_trace": []
  }

output_schema:
  type: object
  properties:
    recommendation_text: {type: string}
    response_text: {type: string}
    content: {type: string}
    raw_response: {type: string}
    final_response: {type: string}
    buddy_list: {type: object}
    planning: {type: object}
    matching_plan: {type: object}
    buddies:
      type: array
      items:
        type: object
        properties:
          user_id: {type: string}
          nickname: {type: string}
          complement_score: {type: number}
          graph_score: {type: number}
          similarity_score: {type: number}
          rank: {type: integer}
          strengths: {type: array, items: {type: string}}
          weaknesses: {type: array, items: {type: string}}
          recommend_reason: {type: string}
          contact_suggestion: {type: string}
          collaboration_mode: {type: string}
    group_suggestion: {type: object}
    rationale: {type: string}
    sequence: {type: array, items: {type: string}}
    reflection: {type: object}
    tool_trace: {type: array, items: {type: object}}
  required: [recommendation_text, buddies, planning, reflection, tool_trace]

input_schema:
  type: object
  properties:
    user_id: {type: string}
    current_message: {type: string}
    recent_messages: {type: array}
    topic: {type: string}
    diagnosis_result: {type: object}
    user_profile: {type: object}
  required: [current_message, recent_messages]
