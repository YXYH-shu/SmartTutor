name: "safety_monitor"
description: "风险与意图识别、三分支决策及安全教育引导智能体"
version: "3.0"
llm_config:
  model: "glm-5"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  temperature: 0.1
  max_tokens: 1800
  timeout: 60
  max_retries: 2
  thinking: false

# SafetyMonitorAgent delegates execution to SafetyPipeline. This file supplies
# registry metadata and the public input/output contract only.
prompt_template: ""

input_schema:
  type: object
  properties:
    raw_text: {type: string}
    current_message: {type: string}
    student_grade: {type: string}
    recent_messages: {type: array}

output_schema:
  type: object
  properties:
    branch: {type: string, enum: ["PASS", "REJECT", "GUIDE"]}
    reject_type: {type: ["string", "null"]}
    safe_query: {type: ["string", "null"]}
    learning_options:
      type: array
      items: {type: string}
    recommended_option: {type: ["string", "null"]}
    direct_response: {type: ["string", "null"]}
    safety_context: {type: object}
  required: [branch, learning_options, recommended_option, safety_context]
