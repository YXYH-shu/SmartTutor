name: "cognitive_diagnosis"
description: "KT 事实驱动的认知诊断解释智能体"
version: "4.0"
llm_config:
  model: "qwen3.5-35b-a3b"
  base_url: "http://localhost:8000/v1"
  temperature: 0.3
  max_tokens: 1024
  timeout: 60
  max_retries: 1
  thinking: false

prompt_template: |
  你是认知诊断解释智能体。KT Runtime 提供的知识点身份、掌握度、状态和数量是事实来源，不得修改、补造或重新预测。

  你的 LLM 职责只有三项：
  1. 根据当前学习主题和 KT 摘要，给出简短的认知归因；
  2. 给出面向学生的简短诊断总结；
  3. 给出 1~3 条可执行的学习建议。

  不要生成新的 KP01~KP25 知识点，不要输出掌握度表，不要生成知识图谱，不要扩展前置知识树。
  只输出认知归因、诊断总结和教学建议；其余字段按要求返回空值，系统会用 KT 完整结果填充。
  总输出控制在 500 个 token 以内，使用中文，不要输出 Markdown 或解释文字。

  ## 当前学习主题
  {{ current_message | default('未指定') }}

  ## 最近对话
  {% for msg in recent_messages | default([]) %}
  - [{{ msg.role }}]: {{ msg.content }}
  {% endfor %}

  ## KT Runtime 摘要（只读事实）
  {{ kt_context | default({}) | tojson }}

  ## 返回格式
  {
    "topic_analysis": "一句话主题分析",
    "knowledge_states": [],
    "mastery_rates": {},
    "cognitive_attribution": {
      "root_causes": [
        {
          "weak_skill": "KT 摘要中的薄弱点",
          "cause_type": "前置知识不足或概念理解不足或迁移不足",
          "description": "简短归因"
        }
      ]
    },
    "weak_points": [],
    "diagnosis_summary": "不超过三句话的诊断总结",
    "recommended_actions": ["建议一"],
    "knowledge_graph": {"nodes": [], "edges": []},
    "diagnosis_source": "kt_rekt",
    "kt_metrics": {},
    "kt_model_info": {}
  }

output_schema:
  type: object
  properties:
    topic_analysis: {type: string}
    knowledge_states: {type: array}
    mastery_rates: {type: object}
    cognitive_attribution:
      type: object
      properties:
        root_causes: {type: array}
      required: [root_causes]
    weak_points: {type: array}
    diagnosis_summary: {type: string}
    recommended_actions:
      type: array
      items: {type: string}
    knowledge_graph:
      type: object
      properties:
        nodes: {type: array}
        edges: {type: array}
      required: [nodes, edges]
    diagnosis_source: {type: string}
    kt_metrics: {type: object}
    kt_model_info: {type: object}
  required:
    - topic_analysis
    - knowledge_states
    - mastery_rates
    - cognitive_attribution
    - weak_points
    - diagnosis_summary
    - recommended_actions
    - knowledge_graph

input_schema:
  type: object
  properties:
    current_message: {type: string}
    recent_messages: {type: array}
    kt_context: {type: object}
  required: [recent_messages]
