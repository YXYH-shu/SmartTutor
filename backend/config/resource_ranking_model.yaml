enabled: true
ckpt_dir: "algorithm/resource_recommendation/checkpoints/smart_tutor_mock_init"
device: auto
batch_size: 64
schema_path: "algorithm/resource_recommendation/checkpoints/smart_tutor_mock_init/schema.json"
vocab_path: "algorithm/resource_recommendation/checkpoints/smart_tutor_mock_init/vocab.json"
sequence_domain: seq_a
sequence_max_len: 20
seq_max_lens:
  seq_a: 20

feature_mapping:
  user_int:
    - {path: "user_features.user_id", fid: 1, type: category}
    - {path: "user_features.current_level", fid: 2, type: category}
    - {path: "user_features.grade_level", fid: 3, type: category}
    - {path: "user_features.learning_style", fid: 4, type: category}
    - {path: "user_features.weak_points", fid: 5, type: category_list}
    - {path: "user_features.preference_keys", fid: 6, type: category_list}

  item_int:
    - {path: "item_features.resource_id", fid: 101, type: category}
    - {path: "item_features.resource_type", fid: 102, type: category}
    - {path: "item_features.knowledge_tags", fid: 103, type: category_list}
    - {path: "item_features.difficulty", fid: 104, type: numeric_bucket, bucket_size: 0.1}
    - {path: "item_features.time_need", fid: 105, type: numeric_bucket, bucket_size: 5}
    - {path: "item_features.has_url", fid: 106, type: numeric_bucket, bucket_size: 1}
    - {path: "item_features.full_score", fid: 107, type: numeric_bucket, bucket_size: 1}

  user_dense:
    - {path: "user_features.knowledge_mastery_avg", fid: 201, offset: 0}
    - {path: "user_features.history_length", fid: 202, offset: 0}
    - {path: "user_features.weak_point_count", fid: 203, offset: 0}

  seq:
    interaction:
      domain: seq_a
      timestamp_path: "sequence_features.interaction.created_at_seq"
      fields:
        - {path: "sequence_features.interaction.resource_id_seq", fid: 1001, type: category_sequence}
        - {path: "sequence_features.interaction.resource_type_seq", fid: 1002, type: category_sequence}
        - {path: "sequence_features.interaction.result_type_seq", fid: 1003, type: category_sequence}
        - {path: "sequence_features.interaction.is_rec_seq", fid: 1004, type: category_sequence}
        - {path: "sequence_features.interaction.is_correct_seq", fid: 1005, type: category_sequence}
        - {path: "sequence_features.interaction.score_seq", fid: 1006, type: numeric_bucket_sequence, bucket_size: 10}
        - {path: "sequence_features.interaction.learn_score_seq", fid: 1007, type: numeric_bucket_sequence, bucket_size: 10}
        - {path: "sequence_features.interaction.feedback_score_seq", fid: 1008, type: numeric_bucket_sequence, bucket_size: 1}
