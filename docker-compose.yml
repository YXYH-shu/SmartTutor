version: "3.9"

services:
  # ------------------------------------------------------------------
  # MySQL 8.0
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: smart_tutor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: smart_tutor
      MYSQL_USER: tutor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tutor123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Backend (FastAPI)
  # ------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    container_name: smart_tutor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SMART_TUTOR_DATABASE__ASYNC_MYSQL_URL: mysql+aiomysql://tutor:tutor123@mysql:3306/smart_tutor
      SMART_TUTOR_APP__DEBUG: "true"
      SMART_TUTOR_APP__SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars!!}
      SMART_TUTOR_LANGGRAPH__CHECKPOINT_TYPE: ${CHECKPOINT_TYPE:-memory}
      SMART_TUTOR_KT__MODE: integrated
      SMART_TUTOR_KT__SKILL_PATH: services/kt-runtime-skill
      SMART_TUTOR_KT__DEVICE: ${KT_DEVICE:-cpu}
      SMART_TUTOR_KT__DEMO_STUDENT_ID: ${KT_STUDENT_ID:-43}
      SMART_TUTOR_KT__FALLBACK_TO_LLM: "false"
      SMART_TUTOR_LPP__ENABLED: "true"
      SMART_TUTOR_LPP__SKILL_PATH: services/lpp-skill
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./services/kt-runtime-skill:/app/services/kt-runtime-skill:ro
      - ./services/lpp-skill:/app/services/lpp-skill:ro
    working_dir: /app/backend
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ------------------------------------------------------------------
  # Frontend (React + Vite → nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_tutor_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
