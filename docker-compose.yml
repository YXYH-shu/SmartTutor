version: "3.9"

services:
  # ------------------------------------------------------------------
  # MySQL 8.0
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: smart_tutor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: smart_tutor
      MYSQL_USER: tutor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tutor123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Backend (FastAPI)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_tutor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SMART_TUTOR_DATABASE__ASYNC_MYSQL_URL: mysql+aiomysql://tutor:tutor123@mysql:3306/smart_tutor
      SMART_TUTOR_APP__DEBUG: "true"
      SMART_TUTOR_APP__SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars!!}
      SMART_TUTOR_LLM__PROVIDER: ${LLM_PROVIDER:-glm}
      SMART_TUTOR_LLM__BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      SMART_TUTOR_LLM__API_KEY: ${LLM_API_KEY:-sk-xxxxxxxxxxxxxxxx}
      SMART_TUTOR_LLM__MODEL_NAME: ${LLM_MODEL_NAME:-glm-4-flash}
      SMART_TUTOR_LANGGRAPH__CHECKPOINT_TYPE: ${CHECKPOINT_TYPE:-memory}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ------------------------------------------------------------------
  # Frontend (React + Vite → nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_tutor_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
