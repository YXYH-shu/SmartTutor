[project]
name = "chat-agent"
version = "0.1.0"
description = "Local skill-aware chat agent runtime with DeepAgents bridge."
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.6.8",
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
